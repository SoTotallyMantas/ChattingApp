name: voxlock
services:
  # =========================
  # BACKEND (.NET 10)
  # =========================
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: ${S3_BUCKET}
      S3_KEY_ID: ${S3_KEY_ID}
      S3_KEY_SECRET: ${S3_KEY_SECRET}
      ONNX_MODEL: ${ONNX_MODEL_PATH}
      ONNX_VOCAB: ${ONNX_VOCAB_PATH}
      JWT_SECRET_KEY: ${JWT_SECRET}
      ENCRYPTION_MASTER_KEY: ${DATA_ENCRYPTION_MASTER_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
      janus:
        condition: service_started
    volumes:
      - ./models:/models:ro
    networks:
      - app-network

  # =========================
  # FRONTEND (React + Nginx)
  # =========================
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
      - "3443:443"    
    depends_on:
      - backend
      - janus
    networks:
      - app-network

  # =========================
  # POSTGRES
  # =========================
  postgres:
    container_name: postgres
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: postgres-pgvector:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # =========================
  # PGADMIN
  # =========================
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.11
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8085:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network 
  # =========================
  # GARAGE (S3 Storage)
  # =========================
  garage:
    container_name: garage
    image: dxflrs/garage:v2.1.0
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # RPC
      - "3902:3902"   # Admin API
    environment:     
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_METRICS_TOKEN=${GARAGE_METRICS_TOKEN}
      - S3_BUCKET=${S3_BUCKET}
      - S3_KEY_ID=${S3_KEY_ID}
      - S3_KEY_SECRET=${S3_KEY_SECRET}
    networks:
      - app-network
  # =========================
  # GARAGE WEBUI
  # =========================
  garage-webui:
    image: khairul169/garage-webui:1.1.0
    container_name: garage-webui
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      - "3909:3909"
    environment:
      API_BASE_URL: "http://garage:3902"      # Admin API endpoint
      S3_ENDPOINT_URL: "http://garage:3900"   # S3 API 
      API_ADMIN_KEY: "${GARAGE_ADMIN_TOKEN}"  # Bearer token
    networks:
      - app-network

  # =========================
  # JANUS WebRTC SFU
  # =========================
  janus:
    container_name: janus
    image: sucwangsr/janus-webrtc-gateway-docker:1.3.3-muti
    volumes:
      - ./janus.jcfg:/usr/local/etc/janus/janus.jcfg
    ports:
      - "8188:8188"          # WebSockets
      - "8088:8088"          # Admin/REST API 
      - "10000-10200:10000-10200/udp"  # RTP/RTCP media
    networks:
      - app-network
    restart: unless-stopped

# =========================
# NETWORKS
# =========================
networks:
  app-network:
    driver: bridge

# =========================
# VOLUMES
# =========================
volumes:
  postgres_data:
  garage_meta:
  garage_data:
  pgadmin_data:
